name: Windows CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build and regression checks
        shell: pwsh
        run: ./build_and_release.ps1 -FailFast
      - name: Upload verified package
        uses: actions/upload-artifact@v4
        with:
          name: Aperture-windows-x64
          path: dist/*.zip
          retention-days: 7
